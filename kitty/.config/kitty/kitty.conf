font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Extra Bold
bold_italic_font JetBrainsMono Nerd Font Mono Extra Bold Italic

### TILING WINDOW STUFF
# Set window layout
enabled_layouts splits:split_axis=horizontal

# New windows (splits), open in the current working directory
map ctrl+alt+v launch --cwd=current --location=vsplit
map ctrl+alt+h launch --cwd=current --location=hsplit

# Move focus for tiling windows
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Resize windows
map alt+shift+h resize_window wider
map alt+shift+l resize_window narrower
map alt+shift+j resize_window shorter
map alt+shift+k resize_window taller

# Disable fancy >> and >= etc. 
disable_ligatures always
